name: Build and Release dpkg

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            dh-virtualenv \
            python3-all \
            python3-setuptools \
            python3-pip \
            python3-venv \
            dh-python

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" | sed 's/^v//' >> $GITHUB_OUTPUT
          else
            echo "version=0.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Update changelog version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/peertube2nostr (0.1.0)/peertube2nostr ($VERSION)/" debian/changelog

      - name: Build source package
        run: dpkg-source -b .

      - name: Build binary package
        run: dpkg-buildpackage -us -uc -b

      - name: Find built .deb files
        id: find_debs
        run: |
          find .. -name "*.deb" -type f > debs.txt
          cat debs.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PeerTube2Nostr ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            ../peertube2nostr-desktop_*.deb
