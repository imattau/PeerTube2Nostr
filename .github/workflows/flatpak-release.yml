name: Build and Release Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag/release to upload the Flatpak to (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf -y install rust cargo nodejs npm webkit2gtk4.1-devel jq
          dnf clean all

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: peertube2nostr.flatpak
          manifest-path: build-aux/flatpak/com.peertube2nostr.desktop.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak (tag release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: peertube2nostr.flatpak

      - name: Upload Flatpak (manual release)
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_id=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            | jq -r .id)
          asset_id=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
            | jq -r '.[] | select(.name == "peertube2nostr.flatpak") | .id' | head -n1)
          if [ -n "$asset_id" ]; then
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @peertube2nostr.flatpak \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=peertube2nostr.flatpak"
