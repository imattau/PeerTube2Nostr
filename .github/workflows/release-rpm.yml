name: Build and Release RPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            rpm-build \
            rpmdevtools \
            python3-devel \
            python3-setuptools \
            python3-pip \
            python3-wheel \
            python3-virtualenv \
            desktop-file-utils \
            git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up RPM build directories
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

      - name: Create source tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar czf ~/rpmbuild/SOURCES/peertube2nostr-${VERSION}.tar.gz \
            --transform "s,^,peertube2nostr-${VERSION}/," \
            .

      - name: Get version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" | sed 's/^v//' >> $GITHUB_OUTPUT
          else
            echo "version=0.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Update spec file version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^Version:        .*/Version:        $VERSION/" peertube2nostr.spec
          sed -i "s/^Release:        .*/Release:        1%{?dist}/" peertube2nostr.spec

      - name: Build RPM package
        run: |
          rpmbuild -ba peertube2nostr.spec

      - name: Find built RPM files
        id: find_rpms
        run: |
          find ~/rpmbuild/RPMS -name "*.rpm" -type f > rpms.txt
          cat rpms.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PeerTube2Nostr ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            ~/rpmbuild/RPMS/noarch/*.rpm
