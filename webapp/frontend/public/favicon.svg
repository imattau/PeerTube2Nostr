<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="52%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <radialGradient id="bgGlow" cx="38%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ringArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#E0E7FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Subtle bottom depth bevel for squircle -->
  <rect x="32" y="38" width="448" height="448" rx="104" fill="#1E1B4B" />

  <!-- Main rounded squircle background -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGlow)" />

  <!-- Subtle inner top edge highlight -->
  <rect x="34" y="34" width="444" height="444" rx="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4" />

  <!-- Nostr relay orbital ring (base track) -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="16" />

  <!-- Connecting broadcast arcs on orbital ring -->
  <path d="M 162.7 162.7 A 132 132 0 0 1 349.3 349.3"
        fill="none" stroke="url(#ringArcGrad)" stroke-width="16" stroke-linecap="round" />
  <path d="M 162.7 349.3 A 132 132 0 0 1 124 256"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="16" stroke-linecap="round" />

  <!-- Subtle broadcast rays from play tip toward relay nodes -->
  <g stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="6" stroke-linecap="round">
    <line x1="322" y1="238" x2="349.3" y2="162.7" />
    <line x1="322" y1="274" x2="349.3" y2="349.3" />
    <line x1="190" y1="184" x2="162.7" y2="162.7" />
    <line x1="190" y1="328" x2="162.7" y2="349.3" />
  </g>

  <!-- Relay nodes around the orbital ring -->
  <g filter="url(#softShadow)">
    <!-- Top-left relay node -->
    <circle cx="162.7" cy="162.7" r="18" fill="#FFFFFF" />
    <circle cx="162.7" cy="162.7" r="8" fill="#3B82F6" />

    <!-- Top-right relay node -->
    <circle cx="349.3" cy="162.7" r="18" fill="#FFFFFF" />
    <circle cx="349.3" cy="162.7" r="8" fill="#6366F1" />

    <!-- Bottom-left relay node -->
    <circle cx="162.7" cy="349.3" r="18" fill="#FFFFFF" />
    <circle cx="162.7" cy="349.3" r="8" fill="#4F46E5" />
  </g>

  <!-- PeerTube-inspired 3-facet geometric play triangle (center-left) -->
  <g filter="url(#softShadow)">
    <!-- Inner subtle backing facet to unify the triangle -->
    <polygon points="188,256 264,212 264,300" fill="#FFFFFF" fill-opacity="0.16" />

    <!-- Top-left facet (white) -->
    <polygon points="188,168 264,212 188,256" fill="#FFFFFF" />

    <!-- Bottom-left facet (warm amber) -->
    <polygon points="188,256 264,300 188,344" fill="#FB923C" />

    <!-- Right play-tip facet (PeerTube orange) -->
    <polygon points="264,212 340,256 264,300" fill="#F97316" />
  </g>

  <!-- Golden Nostr lightning zap badge at bottom-right relay node -->
  <g filter="url(#softShadow)">
    <circle cx="349.3" cy="349.3" r="44" fill="url(#zapGrad)" stroke="#FFFFFF" stroke-width="5" />
    <path d="M 356 320 L 331 352 L 348 352 L 342 379 L 368 346 L 351 346 Z"
          fill="#1E1B4B" stroke="#1E1B4B" stroke-width="2" stroke-linejoin="round" />
  </g>
</svg>
