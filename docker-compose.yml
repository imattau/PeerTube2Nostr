services:
  peertube2nostr:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./data:/data
    environment:
      DB_PATH: /data/peertube2nostr.db
      NSEC_FILE: /data/peertube2nostr.db.nsec
    command: ["interactive"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      PEERTUBE2NOSTR_DB_PATH: /data/peertube2nostr.db
      PEERTUBE2NOSTR_API_KEY: ""
    command: ["uvicorn", "webapp.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
